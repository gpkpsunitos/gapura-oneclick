<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mobile nav equal-grid QA</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #eef3eb; color: #0f172a; font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
    main { width: min(100%, 420px); margin: 0 auto; padding: 28px 8px 44px; }
    h1 { margin: 0 4px 5px; font-size: 20px; letter-spacing: -.025em; }
    .lead { margin: 0 4px 24px; color: #64748b; font-size: 12px; }
    section { margin-top: 22px; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 5px 8px; }
    h2 { margin: 0; font-size: 12px; }
    output { color: #16794f; font: 700 11px/1 ui-monospace, monospace; }
    .shell { position: relative; height: 60px; border: 1px solid rgba(229,231,235,.5); border-radius: 32px; background: #fff; box-shadow: 0 8px 32px rgba(0,0,0,.12); }
    nav { position: relative; display: grid; align-items: center; height: 60px; padding-inline: 4px; }
    button { position: relative; min-width: 0; height: 44px; padding: 4px 0; border: 0; background: transparent; color: #94a3b8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 600 9px/1 ui-sans-serif, system-ui, sans-serif; }
    button.active { color: #e91e63; }
    button.active::after { content: ""; position: absolute; bottom: 0; width: 4px; height: 4px; border-radius: 50%; background: #e91e63; }
    .glyph { width: 18px; height: 18px; border: 2px solid currentColor; border-radius: 4px; }
    .primary-cell { position: relative; top: -8px; display: flex; align-items: center; justify-content: center; }
    .primary { width: 48px; height: 48px; padding: 0; border: 4px solid #fff; border-radius: 50%; background: #0f172a; color: #fff; box-shadow: 0 7px 15px rgba(15,23,42,.25); display: grid; place-items: center; }
    .plus { position: relative; width: 24px; height: 24px; border: 2px solid #fff; border-radius: 50%; }
    .plus::before,.plus::after { content:""; position:absolute; inset:50% auto auto 50%; width:12px; height:2px; border-radius:2px; background:#fff; transform:translate(-50%,-50%); }
    .plus::after { transform:translate(-50%,-50%) rotate(90deg); }
    .ruler { height: 18px; margin: 7px 4px 0; position: relative; }
    .ruler i { position: absolute; top: 0; width: 1px; height: 8px; background: #e91e63; transform: translateX(-.5px); }
    .ruler::before { content: "control centers"; position: absolute; right: 0; top: 5px; color: #94a3b8; font-size: 9px; }
  </style>
</head>
<body>
<main>
  <h1>Implemented spacing QA</h1>
  <p class="lead">Same dynamic equal-column rule used by MobileBottomNav at a 375px phone viewport.</p>

  <section>
    <div class="section-head"><h2>4 items · reference configuration</h2><output></output></div>
    <div class="shell"><nav data-nav style="grid-template-columns:repeat(4,minmax(0,1fr))">
      <button class="active"><span class="glyph"></span>Home</button>
      <button><span class="glyph"></span>Reports</button>
      <div class="primary-cell"><button class="primary" aria-label="Create"><span class="plus"></span></button></div>
      <button><span class="glyph"></span>Menu</button>
    </nav></div><div class="ruler"></div>
  </section>

  <section>
    <div class="section-head"><h2>3 items · staff configuration</h2><output></output></div>
    <div class="shell"><nav data-nav style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <button class="active"><span class="glyph"></span>Reports</button>
      <div class="primary-cell"><button class="primary" aria-label="Create"><span class="plus"></span></button></div>
      <button><span class="glyph"></span>Menu</button>
    </nav></div><div class="ruler"></div>
  </section>

  <section>
    <div class="section-head"><h2>5 items · AI-enabled configuration</h2><output></output></div>
    <div class="shell"><nav data-nav style="grid-template-columns:repeat(5,minmax(0,1fr))">
      <button class="active"><span class="glyph"></span>Home</button>
      <button><span class="glyph"></span>Reports</button>
      <div class="primary-cell"><button class="primary" aria-label="Create"><span class="plus"></span></button></div>
      <button><span class="glyph"></span>AI</button>
      <button><span class="glyph"></span>Menu</button>
    </nav></div><div class="ruler"></div>
  </section>
</main>
<script>
  requestAnimationFrame(() => {
    document.querySelectorAll('[data-nav]').forEach((nav) => {
      const centers = [...nav.children].map((item) => {
        const box = item.getBoundingClientRect();
        return box.left + box.width / 2;
      });
      const gaps = centers.slice(1).map((center, index) => center - centers[index]);
      const section = nav.closest('section');
      section.querySelector('output').textContent = gaps.map((gap) => gap.toFixed(2)).join(' · ') + ' px';
      const navBox = nav.getBoundingClientRect();
      const ruler = section.querySelector('.ruler');
      centers.forEach((center) => {
        const tick = document.createElement('i');
        tick.style.left = ((center - navBox.left) / navBox.width * 100) + '%';
        ruler.appendChild(tick);
      });
    });
  });
</script>
</body>
</html>
